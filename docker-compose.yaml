services:
  backend:
    build:
      context: .
      dockerfile: "backend/Dockerfile"
    container_name: "qwick_backend"
    environment:
      DB_URL: "postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-qwick_db}"
      DB_ECHO: False
      API_HOST: "0.0.0.0"
      API_PORT: 8000
      AUTH__PRIVATE_KEY_PATH: "certs/private-key.pem"
      AUTH__PUBLIC_KEY_PATH: "certs/public-key.pem"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ".:/app"

  db:
    image: postgres:16-alpine
    container_name: "qwick_db"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-qwick_db}
    ports:
      - "5432:5432"
    volumes:
      - "postgres_data:/var/lib/postgresql/data"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-qwick_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: qwick_nginx
    ports:
      - "80:80"
    volumes:
      - "./nginx/default.conf:/etc/nginx/conf.d/default.conf"
      - "./frontend:/usr/share/nginx/html"
    depends_on:
      - backend

volumes:
  postgres_data:
  .:
