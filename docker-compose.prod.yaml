services:
  backend:
    volumes:
      - "./uploads:/app/uploads"

  db:
    volumes:
      - "postgres_data:/var/lib/postgresql/data"

  pgadmin:
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - "pgadmin_data:/var/lib/pgadmin"

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./nginx/ssl:/etc/nginx/ssl:ro"

volumes:
  postgres_data:
  pgadmin_data:
