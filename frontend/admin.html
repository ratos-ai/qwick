<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Админ-панель | Управление</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>Панель управления</h2>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-btn active" id="tabBtnAttractions">Контент</button>
        <button class="nav-btn" id="tabBtnOrders">Заказы</button>
      </nav>
      <div class="sidebar-footer">
        <a href="/" class="back-link">На главную</a>
      </div>
    </aside>

    <main class="main-content">
      <div id="sectionAttractions">
        <h1 class="page-title">Управление контентом</h1>

        <div class="form-card">
          <form id="addForm">
            <div class="form-grid">
              
              <div class="form-group full-width">
                <label>Тип контента</label>
                <select id="itemType" required>
                  <option value="attraction">Достопримечательность</option>
                  <option value="place">Заведение</option>
                  <option value="tour">Тур / Экскурсия</option>
                </select>
              </div>

              <div class="form-group">
                <label>Название</label>
                <input type="text" id="title" required placeholder="Например: Эльбрус" />
              </div>

              <div class="form-group">
                <label>Регион</label>
                <select id="region" required>
                  <option value="rso">Северная Осетия</option>
                  <option value="kbr">Кабардино-Балкария</option>
                  <option value="kchr">Карачаево-Черкесия</option>
                  <option value="stav">Ставропольский край</option>
                  <option value="ing">Ингушетия</option>
                  <option value="che">Чечня</option>
                  <option value="dag">Дагестан</option>
                </select>
              </div>

              <div class="form-group">
                <label>Категория</label>
                <input type="text" id="category" required placeholder="Природа, Горы" />
              </div>

              <div class="form-group">
                <label>Символ (если нет фото)</label>
                <input type="text" id="emoji" required value="К" maxlength="5" />
              </div>

              <div class="form-group full-width">
                <label>Краткое описание</label>
                <input type="text" id="short_desc" required placeholder="Высочайшая вершина Европы." />
              </div>

              <div class="form-group full-width">
                <label>Локация</label>
                <input type="text" id="meta" required placeholder="Приэльбрусье" />
              </div>

              <div class="form-group full-width" id="priceGroup" style="display: none;">
                <label>Цена (в рублях)</label>
                <input type="number" id="price" step="0.01" placeholder="2500" />
              </div>

              <div class="form-group full-width">
                <label>Факты о месте</label>
                <div id="factsContainer" class="dynamic-list"></div>
                <button type="button" class="add-row-btn" onclick="addFactRow()">+ Добавить факт</button>
              </div>

              <div class="form-group full-width">
                <label>Секции (описание)</label>
                <div id="sectionsContainer" class="dynamic-list"></div>
                <button type="button" class="add-row-btn" onclick="addSectionRow()">+ Добавить секцию</button>
              </div>
            </div>

            <div class="form-group full-width" style="margin-top: 1rem;">
              <label>Обложка (картинка)</label>
              <input type="file" id="imageFile" accept="image/*" />
            </div>

            <button type="submit" class="submit-btn">Опубликовать</button>
          </form>
          <div id="message"></div>
        </div>
      </div>

      <div id="sectionOrders" style="display: none">
        <h1 class="page-title">Входящие заказы</h1>
        <div class="table-card">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Тур</th>
                <th>Клиент</th>
                <th>Дата</th>
                <th>Сумма</th>
                <th>Статус</th>
                <th>Действие</th>
              </tr>
            </thead>
            <tbody id="adminOrdersBody">
              <tr>
                <td colspan="7" style="text-align: center; padding: 2rem">Загрузка...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/admin.js"></script>
  </body>
</html>
